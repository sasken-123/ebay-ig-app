<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram投稿 承認</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F2F1EC;
    --card:#FFFFFF;
    --ink:#1E2530;
    --ink-soft:#5B6472;
    --line:#DCD7C8;
    --amber:#C57F2B;
    --amber-bg:#F6E8D2;
    --green:#3E7A56;
    --green-bg:#DFEEE3;
    --blue:#2A5C99;
    --blue-bg:#DCE6F2;
    --red:#AE3B3B;
    --red-bg:#F5DEDE;
    --pink:#B23A55;
    --pink-bg:#FBDFE4;
    --gray-bg:#E7E5DD;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans JP', sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:820px;margin:0 auto;padding:10px 20px 60px;}

  .ledger-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap;gap:10px;}
  .ledger-head h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
  .ledger-head .sub{font-size:12px;color:var(--ink-soft);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px;}
  .ledger-no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;}

  #mock-banner{background:var(--amber-bg);color:#7A4E14;font-size:12.5px;text-align:center;padding:8px 14px;border:1px solid var(--amber);border-radius:var(--radius);margin-bottom:14px;}

  .settings-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .settings-strip .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--ink-soft);}
  .settings-strip .chip b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  .queue-summary{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .queue-summary b{color:var(--ink);}

  .candidate{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;margin-bottom:16px;overflow:hidden;transition:opacity .2s ease, transform .2s ease;}
  .candidate.decided{opacity:0.45;}
  .candidate.decided.is-approved{border-left-color:var(--green);}
  .candidate.decided.is-skipped{border-left-color:var(--ink-soft);}

  .candidate-head{background:var(--gray-bg);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);}
  .candidate-head .rank{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.5px;color:var(--ink-soft);text-transform:uppercase;}
  .candidate-head .stamps{display:flex;gap:6px;flex-wrap:wrap;}
  .stamp{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:3px;white-space:nowrap;}
  .stamp.st-days{background:var(--blue-bg);color:var(--blue);}
  .stamp.st-rate{background:var(--amber-bg);color:#8A5A1E;}
  .stamp.st-result{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;}
  .stamp.st-result.approved{background:var(--green-bg);color:var(--green);}
  .stamp.st-result.skipped{background:var(--gray-bg);color:var(--ink-soft);}

  .candidate-body{padding:14px;display:flex;gap:14px;}
  .candidate-img{width:112px;height:112px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--gray-bg);border:1px solid var(--line);}
  .candidate-main{flex:1;min-width:0;}
  .item-name{font-weight:700;font-size:15px;line-height:1.35;margin:0 0 4px;}
  .item-price{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);margin-bottom:8px;}
  .point-box{background:#FBFAF7;border:1px dashed var(--line);border-radius:5px;padding:8px 10px;font-size:12.5px;line-height:1.55;color:var(--ink);margin-bottom:10px;}
  .point-box .label{font-size:10px;letter-spacing:0.5px;color:var(--ink-soft);text-transform:uppercase;display:block;margin-bottom:3px;}

  .hashtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .hashtags span{font-size:11px;background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:12px;}

  .caption-box{border:1px solid var(--line);border-radius:5px;padding:9px 11px;font-size:12.5px;line-height:1.6;color:var(--ink);background:#FDFCFA;white-space:pre-wrap;margin-bottom:12px;}
  .caption-box .label{font-size:10px;letter-spacing:0.5px;color:var(--ink-soft);text-transform:uppercase;display:block;margin-bottom:4px;}

  .decision-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .decision-row select{font-family:'IBM Plex Sans JP',sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);font-size:12.5px;color:var(--ink);min-width:170px;}
  button{font-family:'IBM Plex Sans JP',sans-serif;cursor:pointer;border:none;border-radius:var(--radius);padding:8px 16px;font-size:12.5px;font-weight:600;transition:opacity .15s ease;}
  button:hover{opacity:0.85;}
  button:disabled{cursor:default;opacity:0.4 !important;}
  .btn-approve{background:var(--ink);color:#fff;}
  .btn-skip{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);}
  .spacer{flex:1;}
  .decided-note{font-size:12px;color:var(--ink-soft);font-style:italic;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:8px;}
  .empty-state .big{font-size:34px;margin-bottom:6px;}

  #toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.25);opacity:0;transform:translateY(-8px);transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.success{background:var(--green);}
  .toast.skip{background:var(--ink-soft);}

  @media(max-width:560px){
    .candidate-body{flex-direction:column;}
    .candidate-img{width:100%;height:180px;}
    .decision-row select{min-width:0;flex:1;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="ledger-head">
    <div>
      <h1>Instagram投稿 承認</h1>
      <div class="sub">eBay 出品商品 → Instagram 自動投稿</div>
    </div>
    <div class="ledger-no" id="today-label"></div>
  </div>

  <div id="mock-banner">
    🔧 これは画面確認用のモック版です。表示している候補・おすすめポイント・投稿文はすべてダミーデータで、GAS／eBay API／Claude APIとはまだ接続していません。
  </div>

  <div class="settings-strip">
    <div class="chip">抽出条件：出品から <b>3日</b> 以上 ／ 1日あたり view <b>15</b> 以上</div>
    <div class="chip">投稿先候補：<b>3〜5件</b>／回</div>
  </div>

  <div class="queue-summary">
    本日の候補：<b id="total-count">-</b>件　（承認 <b id="approved-count">0</b>／見送り <b id="skipped-count">0</b>）
  </div>

  <div id="candidate-list"></div>

  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="big">✅</div>
    すべての候補を確認しました。<br>お疲れさまでした。
  </div>

</div>

<div id="toast-wrap"></div>

<script>
  // ------------------------------------------------------------------
  // モックデータ（本番では GAS Web App から fetch() で取得する想定）
  // ------------------------------------------------------------------
  const IG_ACCOUNTS = [
    { id: "main", label: "@sunsun_ebay_main（本アカウント）" },
    { id: "sub",  label: "@sunsun_shop_sub（サブアカウント）" },
    { id: "test", label: "@sunsun_test（テスト用）" }
  ];

  const MOCK_CANDIDATES = [
    {
      id: "ebay-2201983001",
      name: "Vintage Casio G-Shock DW-5600 Black Digital Watch NOS",
      price: "$128.00",
      listedDaysAgo: 6,
      viewsPerDay: 24.3,
      image: "https://placehold.co/240x240/1E2530/F2F1EC?text=G-SHOCK",
      point: "1990年代の希少なデッドストック個体。ベルト・液晶ともに使用感が少なく、コレクター需要が高いモデルです。",
      hashtags: ["#gshock", "#casio", "#vintagewatch", "#y2kwatch", "#寺沢先輩"],
      caption: "Vintage CASIO G-SHOCK DW-5600 ⌚️\n$128.00\n\n90年代デッドストックの希少個体。詳細・購入はプロフィールのリンクから eBay 出品ページへどうぞ。\n\n#gshock #casio #vintagewatch #y2kwatch"
    },
    {
      id: "ebay-2201983002",
      name: "Pokemon Card Charizard Holo 1st Edition Base Set PSA-ready",
      price: "$540.00",
      listedDaysAgo: 4,
      viewsPerDay: 61.8,
      image: "https://placehold.co/240x240/C57F2B/1E2530?text=CHARIZARD",
      point: "初版base setのリザードンHolo。エッジの角欠けが少なく、鑑定（PSA）に出す前提での購入層からの反応が期待できます。",
      hashtags: ["#pokemoncard", "#charizard", "#1stedition", "#psa", "#pokemontcg"],
      caption: "Pokemon Charizard Holo – 1st Edition Base Set 🔥\n$540.00\n\nPSA鑑定前提でも狙い目の1枚。詳細はプロフィールのリンクから eBay 出品ページへ。\n\n#pokemoncard #charizard #1stedition #psa"
    },
    {
      id: "ebay-2201983003",
      name: "Nike Air Jordan 1 Retro High OG \"Chicago\" 2022 US9.5",
      price: "$310.00",
      listedDaysAgo: 9,
      viewsPerDay: 18.1,
      image: "https://placehold.co/240x240/2A5C99/F2F1EC?text=AJ1",
      point: "定番人気カラー「シカゴ」の2022年再販モデル。US9.5サイズは在庫が薄く、海外バイヤーからの問い合わせが多いサイズ帯です。",
      hashtags: ["#airjordan1", "#chicago", "#sneakers", "#jordan1", "#kicksonfire"],
      caption: "Air Jordan 1 Retro High OG \"Chicago\" (2022) 👟\n$310.00\n\nUS9.5、在庫僅少。詳細はプロフィールのリンクから eBay 出品ページへ。\n\n#airjordan1 #chicago #sneakers #jordan1"
    }
  ];

  // ------------------------------------------------------------------
  // 描画・操作ロジック
  // ------------------------------------------------------------------
  const state = {
    decisions: {} // { [id]: 'approved' | 'skipped' }
  };

  function fmtDate(d){
    const w = ["日","月","火","水","木","金","土"][d.getDay()];
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} (${w})`;
  }

  function renderHeader(){
    document.getElementById('today-label').textContent = fmtDate(new Date());
    document.getElementById('total-count').textContent = MOCK_CANDIDATES.length;
  }

  function renderCounts(){
    const vals = Object.values(state.decisions);
    document.getElementById('approved-count').textContent = vals.filter(v => v === 'approved').length;
    document.getElementById('skipped-count').textContent = vals.filter(v => v === 'skipped').length;
    document.getElementById('empty-state').style.display =
      (vals.length === MOCK_CANDIDATES.length) ? 'block' : 'none';
  }

  function accountOptions(){
    return `<option value="">投稿先アカウントを選択…</option>` +
      IG_ACCOUNTS.map(a => `<option value="${a.id}">${a.label}</option>`).join('');
  }

  function candidateCard(c, idx){
    return `
    <div class="candidate" id="card-${c.id}" data-id="${c.id}">
      <div class="candidate-head">
        <div class="rank">候補 ${idx + 1}</div>
        <div class="stamps">
          <span class="stamp st-days">出品${c.listedDaysAgo}日経過</span>
          <span class="stamp st-rate">${c.viewsPerDay.toFixed(1)} view/日</span>
          <span class="stamp st-result" id="result-${c.id}" style="display:none;"></span>
        </div>
      </div>
      <div class="candidate-body">
        <img class="candidate-img" src="${c.image}" alt="${c.name}">
        <div class="candidate-main">
          <p class="item-name">${c.name}</p>
          <div class="item-price mono">${c.price}</div>

          <div class="point-box">
            <span class="label">おすすめポイント（自動要約）</span>
            ${c.point}
          </div>

          <div class="hashtags">${c.hashtags.map(h => `<span>${h}</span>`).join('')}</div>

          <div class="caption-box">
            <span class="label">投稿文プレビュー</span>${c.caption}
          </div>

          <div class="decision-row" id="controls-${c.id}">
            <select id="account-${c.id}">${accountOptions()}</select>
            <button class="btn-approve" onclick="handleApprove('${c.id}')">承認して投稿予約</button>
            <button class="btn-skip" onclick="handleSkip('${c.id}')">見送る</button>
            <div class="spacer"></div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function renderList(){
    document.getElementById('candidate-list').innerHTML =
      MOCK_CANDIDATES.map((c, i) => candidateCard(c, i)).join('');
  }

  function showToast(msg, cls){
    const wrap = document.getElementById('toast-wrap');
    const el = document.createElement('div');
    el.className = 'toast ' + (cls || '');
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 250);
    }, 2400);
  }

  function markDecided(id, decision, label){
    state.decisions[id] = decision;
    const card = document.getElementById('card-' + id);
    card.classList.add('decided', decision === 'approved' ? 'is-approved' : 'is-skipped');
    const resultStamp = document.getElementById('result-' + id);
    resultStamp.style.display = 'inline-block';
    resultStamp.classList.add(decision === 'approved' ? 'approved' : 'skipped');
    resultStamp.textContent = decision === 'approved' ? '承認済み' : '見送り';

    const controls = document.getElementById('controls-' + id);
    controls.querySelectorAll('button, select').forEach(el => el.disabled = true);
    const note = document.createElement('span');
    note.className = 'decided-note';
    note.textContent = label;
    controls.appendChild(note);

    renderCounts();
  }

  function handleApprove(id){
    const sel = document.getElementById('account-' + id);
    if (!sel.value){
      showToast('投稿先アカウントを選んでください', 'skip');
      sel.focus();
      return;
    }
    const accountLabel = IG_ACCOUNTS.find(a => a.id === sel.value).label;
    // 本番では、ここで GAS Web App に {itemId, accountId} を POST して
    // 「承認済み・未投稿キュー」に積む（PropertiesService側で保持）。
    markDecided(id, 'approved', `→ ${accountLabel}`);
    showToast('承認しました（' + accountLabel + '）', 'success');
  }

  function handleSkip(id){
    markDecided(id, 'skipped', '見送りました');
    showToast('見送りました', 'skip');
  }

  renderHeader();
  renderList();
  renderCounts();
</script>
</body>
</html>
